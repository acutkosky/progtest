<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python/Terminal Diagnostic Test - Exercise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        #terminal {
            font-family: 'Courier New', monospace;
            height: 400px;
            display: flex;
            flex-direction: column;
            user-select: text;
        }
        #terminal-output {
            flex-grow: 1;
            padding: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
        }
        #terminal-output div {
            user-select: text;
            cursor: text;
        }
        #terminal-output div::selection {
            background-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        #terminal-prompt {
            border-top: 1px solid #444;
            padding: 8px;
            margin-bottom: 0;
        }
        #terminal-input {
            background-color: transparent !important;
            color: #fff !important;
            border: none !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .terminal-line {
            margin-bottom: 5px;
            min-height: 1.2em;
            line-height: 1.2em;
        }
        .terminal-line:empty::before {
            content: "\00a0";
        }
        .ascii-art {
            font-family: 'Courier New', monospace;
            white-space: pre;
            line-height: 1.2;
            margin: 1em 0;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Python/Terminal Diagnostic Test</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="exercise-container" class="row">
            <div class="col-md-12">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item active">Exercise</li>
                    </ol>
                </nav>
            </div>
            
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h2 id="exercise-title">Loading Exercise...</h2>
                        <div id="exercise-status" class="mt-2">
                            <span class="badge bg-secondary">Not Started</span>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="exercise-description"></div>
                        
                        <!-- Python exercise elements -->
                        <div id="python-exercise" style="display: none;">
                            <div class="mb-3">
                                <label for="code-editor" class="form-label">Your Code:</label>
                                <textarea id="code-editor"></textarea>
                            </div>
                            <div class="mb-3">
                                <button id="run-button" class="btn btn-primary">Run Code</button>
                            </div>
                            <div class="mb-3">
                                <label for="output" class="form-label">Output:</label>
                                <pre id="output" class="border p-3 bg-light" style="min-height: 100px; max-height: 300px; overflow-y: auto;">Environment initializing...</pre>
                            </div>
                        </div>
                        
                        <!-- Terminal exercise elements -->
                        <div id="terminal-exercise" style="display: none;">
                            <div id="terminal" class="border bg-dark text-light">
                                <div id="terminal-output" class="flex-grow-1"></div>
                                <div id="terminal-prompt" class="input-group">
                                    <span class="input-group-text bg-dark text-light border-0">$</span>
                                    <input type="text" id="terminal-input" class="form-control bg-dark text-light" 
                                           placeholder="Enter command..." autocomplete="off">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/foldgutter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/fold/indent-fold.min.js"></script>
    
    <script src="js/exercises.js"></script>
    <script src="js/python-runner.js"></script>
    <script src="js/terminal.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // Additional script to show/hide the appropriate exercise type
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const exerciseId = parseInt(urlParams.get('id'));
            
            if (!isNaN(exerciseId) && typeof getExercise === 'function') {
                const exercise = getExercise(exerciseId);
                if (exercise) {
                    // Show the appropriate exercise UI
                    if (exercise.type === 'python') {
                        document.getElementById('python-exercise').style.display = 'block';
                        document.getElementById('terminal-exercise').style.display = 'none';
                    } else if (exercise.type === 'terminal') {
                        document.getElementById('python-exercise').style.display = 'none';
                        document.getElementById('terminal-exercise').style.display = 'block';
                    }
                }
            }
        });
    </script>
</body>
</html>
